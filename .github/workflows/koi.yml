name: Koi

on:
  schedule:
    # Just after midnight UTC, so the koi shows the day that just ended.
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup git-koi
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/git-koi
          gh release download "v1.0.2" --repo "yalongwastaken/git-koi" --dir "/tmp/git-koi" --pattern "*x86_64-unknown-linux-musl.tar.gz"
          tar -xzf /tmp/git-koi/*.tar.gz -C /tmp/git-koi
          echo "/tmp/git-koi/git-koi-1.0.2-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Render koi
        env:
          GH_TOKEN: ${{ github.token }}
          KOI_LOGIN: ${{ github.repository_owner }}
        run: |
          git-koi collect "$KOI_LOGIN" --output /tmp/snapshot.json
          python3 -c "
          import json
          with open('/tmp/snapshot.json') as f:
              s = json.load(f)
          days = s.get('contribution_history', {}).get('days', [])
          c = sum(d.get('contribution_count', 0) for d in days)
          m = 100000 / max(c, 1)
          for d in days:
              if d.get('contribution_count', 0) > 0:
                  d['contribution_count'] = max(1, int(round(d['contribution_count'] * m)))
          with open('/tmp/snapshot.json', 'w') as f:
              json.dump(s, f)
          "
          git-koi render /tmp/snapshot.json --output-dir koi --body white

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi/koi.gif
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet

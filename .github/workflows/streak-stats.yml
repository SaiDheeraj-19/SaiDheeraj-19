name: Generate Streak Stats

on:
  schedule:
    - cron: "0 0 * * *" # Run at midnight UTC daily
  workflow_dispatch: # Allow manual triggering

jobs:
  generate-streak:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate dark mode streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          github_user: ${{ github.repository_owner }}
          path: assets/streak-stats-dark.svg
          theme: transparent
          hide_border: true
          title_color: 8b949e
          text_color: 8b949e
          icon_color: 8b949e

      - name: Generate light mode streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          github_user: ${{ github.repository_owner }}
          path: assets/streak-stats-light.svg
          theme: transparent
          hide_border: true
          title_color: 24292f
          text_color: 24292f
          icon_color: 24292f

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-stats-dark.svg assets/streak-stats-light.svg
          git commit -m "Update GitHub Streak Stats" || exit 0
          git push

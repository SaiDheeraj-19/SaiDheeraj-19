name: Kairo Telemetry

on:
  schedule:
    # Run daily at 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "assets/**"

permissions:
  contents: write

concurrency: telemetry

jobs:
  telemetry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install Pillow

      - name: Generate Luffy Gear 5 Companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/generate_luffy_gif.py

      - name: Commit luffy animation if changed
        shell: bash
        run: |
          git add luffy/luffy.gif
          if git diff --cached --quiet; then
            echo "Luffy animation is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "luffy: update sun god nika gear 5 animation"
          git push --quiet


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; }
    .grid { stroke: #e9ecef; stroke-width: 1; }
    .text-sub { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6c757d; letter-spacing: 2px; text-transform: uppercase; }
    .accent { stroke: #000000; stroke-width: 1.5; fill: none; }
    .node { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    .wave { stroke: #000000; stroke-width: 2; fill: none; opacity: 0.5; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .grid { stroke: #21262d; }
      .text-sub { fill: #8b949e; }
      .accent { stroke: #c9d1d9; }
      .node { fill: #0d1117; stroke: #c9d1d9; }
      .wave { stroke: #c9d1d9; }
    }
  </style>
  
  <rect width="600" height="400" class="bg" rx="8" />
  
  <pattern id="gridLines" width="20" height="20" patternUnits="userSpaceOnUse">
    <line x1="0" y1="0" x2="20" y2="0" class="grid" />
    <line x1="0" y1="0" x2="0" y2="20" class="grid" />
  </pattern>
  <rect width="600" height="400" fill="url(#gridLines)" rx="8" />
  
  <!-- Server Boundary -->
  <circle cx="300" cy="200" r="100" class="accent" stroke-dasharray="2 4" opacity="0.3" />
  
  <!-- Central Relay -->
  <polygon points="300,150 340,200 300,250 260,200" class="node" />
  <text x="300" y="215" text-anchor="middle" class="text-sub" style="font-size: 9px; font-weight: bold;">WS RELAY</text>
  
  <!-- Clients -->
  <rect x="50" y="180" width="80" height="40" class="node" rx="4" />
  <text x="90" y="204" text-anchor="middle" class="text-sub" style="font-size: 10px;">CLIENT A</text>
  
  <rect x="470" y="100" width="80" height="40" class="node" rx="4" />
  <text x="510" y="124" text-anchor="middle" class="text-sub" style="font-size: 10px;">CLIENT B</text>

  <rect x="470" y="260" width="80" height="40" class="node" rx="4" />
  <text x="510" y="284" text-anchor="middle" class="text-sub" style="font-size: 10px;">CLIENT C</text>
  
  <!-- Audio Buffers -->
  <path d="M 140 200 Q 200 170 260 200" class="wave" />
  <path d="M 140 200 Q 200 230 260 200" class="wave" />
  
  <path d="M 340 200 Q 400 150 470 120" class="wave" />
  <path d="M 340 200 Q 400 250 470 280" class="wave" />
  
  <!-- Data packets -->
  <circle cx="200" cy="185" r="3" class="node" />
  <circle cx="405" cy="175" r="3" class="node" />
  <circle cx="405" cy="225" r="3" class="node" />
  
  <text x="300" y="380" text-anchor="middle" class="text-sub">SONICBRIDGE ARCHITECTURE: BINARY WEBSOCKET STREAMING</text>
</svg>

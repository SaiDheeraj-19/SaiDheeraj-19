<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; }
    .grid { stroke: #e9ecef; stroke-width: 1; }
    .text-main { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 32px; font-weight: bold; fill: #212529; letter-spacing: 2px; }
    .text-sub { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 14px; fill: #6c757d; letter-spacing: 4px; text-transform: uppercase; }
    .accent { stroke: #000000; stroke-width: 2; fill: none; }
    .node { fill: #212529; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .grid { stroke: #21262d; }
      .text-main { fill: #c9d1d9; }
      .text-sub { fill: #8b949e; }
      .accent { stroke: #c9d1d9; }
      .node { fill: #c9d1d9; }
    }
  </style>
  
  <rect width="800" height="200" class="bg" />
  
  <!-- Grid Pattern -->
  <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" class="grid" />
  </pattern>
  <rect width="800" height="200" fill="url(#gridPattern)" />
  
  <!-- Technical Graphics -->
  <circle cx="400" cy="100" r="150" class="accent" stroke-dasharray="4 8" opacity="0.5" />
  <circle cx="400" cy="100" r="100" class="accent" stroke-dasharray="2 4" opacity="0.3" />
  <line x1="0" y1="100" x2="800" y2="100" class="accent" opacity="0.2" />
  <line x1="400" y1="0" x2="400" y2="200" class="accent" opacity="0.2" />
  
  <circle cx="400" cy="100" r="4" class="node" />
  <circle cx="250" cy="100" r="3" class="node" />
  <circle cx="550" cy="100" r="3" class="node" />
  <circle cx="400" cy="40" r="3" class="node" />
  
  <!-- Typography -->
  <text x="400" y="110" text-anchor="middle" class="text-main">R. SAI DHEERAJ</text>
  <text x="400" y="140" text-anchor="middle" class="text-sub">SYSTEM SPECIFICATION V1.0</text>
  
  <!-- Corner Tech Accents -->
  <path d="M 20 40 L 20 20 L 40 20" class="accent" />
  <path d="M 780 40 L 780 20 L 760 20" class="accent" />
  <path d="M 20 160 L 20 180 L 40 180" class="accent" />
  <path d="M 780 160 L 780 180 L 760 180" class="accent" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <style>
    .bg { fill: #f8f9fa; }
    .grid { stroke: #e9ecef; stroke-width: 1; }
    .text-sub { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; font-size: 12px; fill: #6c757d; letter-spacing: 2px; }
    .accent { stroke: #000000; stroke-width: 1.5; fill: none; }
    .node { fill: #ffffff; stroke: #000000; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .grid { stroke: #21262d; }
      .text-sub { fill: #8b949e; }
      .accent { stroke: #c9d1d9; }
      .node { fill: #0d1117; stroke: #c9d1d9; }
    }
  </style>
  
  <rect width="600" height="400" class="bg" rx="8" />
  
  <!-- Grid -->
  <pattern id="gridPatternAlpha" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="10" cy="10" r="1" fill="#ced4da" class="grid" />
  </pattern>
  <rect width="600" height="400" fill="url(#gridPatternAlpha)" rx="8" />
  
  <!-- Architecture Diagram Abstract -->
  <rect x="200" y="100" width="200" height="200" class="accent" rx="4" stroke-dasharray="4" opacity="0.5"/>
  
  <!-- Nodes -->
  <circle cx="100" cy="200" r="30" class="node" />
  <circle cx="300" cy="120" r="25" class="node" />
  <circle cx="300" cy="200" r="25" class="node" />
  <circle cx="300" cy="280" r="25" class="node" />
  <circle cx="500" cy="200" r="40" class="node" />
  
  <!-- Connections -->
  <path d="M 130 200 L 275 120" class="accent" />
  <path d="M 130 200 L 275 200" class="accent" />
  <path d="M 130 200 L 275 280" class="accent" />
  
  <path d="M 325 120 L 460 200" class="accent" />
  <path d="M 325 200 L 460 200" class="accent" />
  <path d="M 325 280 L 460 200" class="accent" />
  
  <!-- Labels -->
  <text x="100" y="204" text-anchor="middle" class="text-sub" style="font-size: 10px;">CLIENT</text>
  <text x="500" y="204" text-anchor="middle" class="text-sub" style="font-size: 10px;">DATA</text>
  <text x="300" y="350" text-anchor="middle" class="text-sub">EVENT-DRIVEN ARCHITECTURE</text>
</svg>
